<script>
        // Lightweight interaction for input validation
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('roomIdInput');
            const button = document.getElementById('joinButton');
            const validationMsg = document.getElementById('validationMessage');

            // Format input as user types (example: XXX-XXX-XXX)
            input.addEventListener('input', function(e) {
                let val = this.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
                let formatted = '';
                for (let i = 0; i < val.length; i++) {
                    if (i > 0 && i % 3 === 0) formatted += '-';
                    formatted += val[i];
                }
                this.value = formatted.substring(0, 11); // Max length 11 (9 chars + 2 dashes)
                
                // Hide validation if typing
                validationMsg.classList.remove('opacity-100');
                validationMsg.classList.add('opacity-0');
                input.classList.remove('border-error');
            });

            button.addEventListener('click', () => {
                const val = input.value;
                // Simple validation check (needs to be 11 chars format XXX-XXX-XXX)
                if (val.length !== 11) {
                    validationMsg.classList.remove('opacity-0');
                    validationMsg.classList.add('opacity-100');
                    input.classList.add('border-error');
                    
                    // Shake animation on error
                    input.parentElement.animate([
                        { transform: 'translateX(0)' },
                        { transform: 'translateX(-5px)' },
                        { transform: 'translateX(5px)' },
                        { transform: 'translateX(-5px)' },
                        { transform: 'translateX(5px)' },
                        { transform: 'translateX(0)' }
                    ], { duration: 400, easing: 'ease-in-out' });
                } else {
                    // Success state simulation
                    button.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> <span class="ml-2">Connecting...</span>';
                    button.classList.add('opacity-80', 'cursor-not-allowed');
                    
                    setTimeout(() => {
                        button.innerHTML = '<span class="material-symbols-outlined">check_circle</span> <span class="ml-2">Connected</span>';
                        button.classList.replace('btn-primary', 'bg-tertiary-container text-on-tertiary-container');
                    }, 1500);
                }
            });
        });
    </script>
